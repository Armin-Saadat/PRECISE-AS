[tool.poetry]
name = "afa"
version = "0.1.0"
description = "active feature acquisition"
authors = ["Armin Saadat <armin2saadat@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
torch = "2.0.0"
torchvision = ">=0.15.1, <0.16.0"
torchmetrics = "0.10.3"
xformers = "0.0.18"
numpy = "<2"
attributedict = "0.3.0"
colorlog = "6.8.2"
gymnasium = "0.29.1"
matplotlib = "3.8.4"
pandas = "2.2.0"
PyYAML = "6.0.1"
scikit-learn = "1.4.1.post1"
seaborn = "0.13.2"
tqdm = "4.66.2"
wandb = "0.16.3"
timm = "1.0.13"
einops = "0.8.1"


[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu117"
priority = "supplemental"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
